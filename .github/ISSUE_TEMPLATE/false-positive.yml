name: False positive
description: Report a finding that is safe in the represented static model.
title: "[False positive] "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: HT003
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic automation
      render: yaml
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why the finding is incorrect
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I replaced household names, URLs, tokens, and private registry data.
          required: true
