name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1785398400"

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify
      - run: npm run release:build
      - name: Upload release checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums-${{ matrix.os }}-node-${{ matrix.node }}
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload demo reports
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: hasstangle-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 14

  reproducibility:
    name: Cross-platform release reproducibility
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-checksums-*
          path: release-checksums
      - run: node scripts/compare-checksums.mjs release-checksums
